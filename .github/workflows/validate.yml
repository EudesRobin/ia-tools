# Controle du depot a chaque push sur main, a chaque pull request et a la
# demande (workflow_dispatch) :
# validateur des sources puis tests du validateur (AGENTS.md, Definition of Done),
# analyse de securite des workflows par zizmor et, sur une pull request,
# controle des messages de commit, du titre, de la description et de l'entree
# du journal des modifications ; sur une pull request vers main, controle que
# sa branche de head est develop (docs/CONTRIBUTING.md section 2).
# Les noms de jobs sont ceux des checks requis par la protection de develop et
# de main.
# Pas de push sur develop : une pull request vers develop doit etre a jour
# avant le merge, et son execution a deja controle le code merge. Le push sur
# main reste : la release lit l'integration continue du commit tague.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited : titre ou description modifies
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la meme branche annule l'execution devenue obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validation
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # rien n'est pousse : le jeton ne reste pas dans .git/config
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"  # version minimale declaree dans docs/PREREQUIS.md
      - run: python -m pip install -r requirements-dev.txt
      # Chaque controle s'execute meme si un precedent echoue : un seul passage
      # donne le diagnostic complet.
      - run: python scripts/validate.py
      - if: ${{ !cancelled() }}
        run: python tests/test_validate.py
      - if: ${{ !cancelled() }}
        run: python tests/test_check_commit_msg.py
      - if: ${{ !cancelled() }}
        run: python tests/test_changelog.py
      - if: ${{ !cancelled() }}
        run: python tests/test_install.py
      - if: ${{ !cancelled() }}
        run: python tests/test_statusline.py
      - if: ${{ !cancelled() }}
        run: python tests/test_adb_tv.py
      - if: ${{ !cancelled() }}
        run: python tests/test_etat_depot.py
      - if: ${{ !cancelled() }}
        run: python tests/test_journal_version.py

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: zizmor --offline .github/workflows

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # historique complet : la plage base..head doit etre lisible
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      # Les valeurs issues de la pull request passent par l'environnement, jamais
      # par une interpolation dans le script : elles sont fournies par l'auteur.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_msg.py --range "$BASE_SHA..$HEAD_SHA"
      - if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_commit_msg.py --pr
      # Toute modification d'un outil ou d'install.py porte une entree
      # du journal des modifications (docs/CONTRIBUTING.md section 4.2).
      - if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/changelog.py --require-entry "$BASE_SHA..$HEAD_SHA"

  # main n'avance que par la PR de publication de develop : toute autre branche
  # de head, ou une branche develop venue d'un fork, est refusee.
  source:
    name: source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Valeurs fournies par l'auteur de la pull request : passees par
      # l'environnement, jamais interpolees dans le script ni reecrites dans
      # une commande de workflow.
      - env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::une pull request vers main doit venir de la branche develop de ce depot"
            exit 1
          fi

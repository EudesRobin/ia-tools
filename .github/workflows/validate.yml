# Controle du depot a chaque push sur main et a chaque pull request :
# validateur des sources puis tests du validateur (AGENTS.md, Definition of Done).
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"  # version minimale declaree dans docs/PREREQUIS.md
      - run: python -m pip install pyyaml
      - run: python scripts/validate.py
      - run: python scripts/test_validate.py
      - run: python scripts/test_check_commit_msg.py

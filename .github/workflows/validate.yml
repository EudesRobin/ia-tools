# Controle du depot a chaque push sur main et a chaque pull request :
# validateur des sources puis tests du validateur (AGENTS.md, Definition of Done),
# et analyse de securite des workflows par zizmor.
# Les noms de jobs sont ceux des checks requis par la protection de main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une nouvelle poussee sur la meme branche annule l'execution devenue obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validation
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # rien n'est pousse : le jeton ne reste pas dans .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"  # version minimale declaree dans docs/PREREQUIS.md
      - run: python -m pip install -r requirements-dev.txt
      # Chaque controle s'execute meme si un precedent echoue : un seul passage
      # donne le diagnostic complet.
      - run: python scripts/validate.py
      - if: ${{ !cancelled() }}
        run: python scripts/test_validate.py
      - if: ${{ !cancelled() }}
        run: python scripts/test_check_commit_msg.py
      - if: ${{ !cancelled() }}
        run: python scripts/test_statusline.py

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: zizmor --offline .github/workflows
